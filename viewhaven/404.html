<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | ViewHaven</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<style>
  :root{
    --cream:#FAF7F0; --sage-deep:#57654C; --sage:#8B9A7E;
    --ink:#3A362F; --ink-soft:#6B665C; --gold:#C4A06A; --line:#E1D8C4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--cream);color:var(--ink);
    font-family:'Karla',sans-serif;font-size:17px;line-height:1.75;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:32px;
  }
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(30px,5vw,44px);margin:0 0 14px;}
  em{font-family:'Fraunces',serif;font-style:italic;color:var(--sage-deep);}
  p{color:var(--ink-soft);max-width:420px;margin:0 auto 28px;}
  .btn{
    display:inline-block;padding:14px 30px;border-radius:999px;
    text-decoration:none;font-weight:600;font-size:15px;
    background:var(--sage-deep);color:#fff;
  }
  .btn:hover{background:var(--sage);}
  .divider{display:flex;align-items:center;gap:18px;max-width:180px;margin:0 auto 28px;}
  .divider .hline{flex:1;height:1px;background:var(--line);}
  .divider .ring{width:12px;height:12px;border:1.5px solid var(--gold);border-radius:50%;}
</style>
</head>
<body>
  <div>
    <h1>This path doesn't <em>lead anywhere</em></h1>
    <div class="divider"><div class="hline"></div><div class="ring"></div><div class="hline"></div></div>
    <p>The page you're looking for isn't here. But the journey doesn't stop, let's get you back on the road.</p>
    <a href="/" class="btn">Back to ViewHaven</a>
  </div>
</body>
</html>
